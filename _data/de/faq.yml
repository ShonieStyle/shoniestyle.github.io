- question: "Für welche Größen und Modelle sind die Schnittmuster?"
  answer: "Ich biete verschiedene Schnittmuster an: Kleidung für Puppen (Maßstab 1/6 und 1/12), Accessoires und Kleidung für Menschen. Bei Puppen achte bitte auf den jeweiligen Körpertyp; bei Schnitten für Personen findest du alle Maßtabellen direkt im Artikel."

- question: "Sind die Nahtzugaben im Schnittmuster enthalten?"
  answer: "**Puppen-Schnittmuster:** Ja, die Nahtzugaben sind enthalten und als **separate Linie** (Naht- und Schnittlinie) eingezeichnet. **Schnittmuster für Menschen:** Nein, die Nahtzugabe ist NICHT enthalten. **Accessoires:** Bitte prüfe hierzu die jeweilige Anleitung."

- question: "Welche Formate werden bereitgestellt und wie drucke ich sie?"
  answer: "Alle Schnitte sind digitale PDFs. Ich stelle für alle Projekte Dateien in **A4 und US Letter** zur Verfügung. Für Schnitte in Menschengröße ist zusätzlich eine **Großformat-Datei (A0/Plotter)** enthalten. **Wichtig:** Drucke immer mit 100% Skalierung. Jedes Schnittmuster enthält ein Kontrollquadrat."

- question: "Sind die Schnittmuster für Anfänger geeignet?"
  answer: "Ja! Die meisten meiner Schnitte sind anfängerfreundlich und enthalten eine Schritt-für-Schritt-Fotoanleitung. Bei komplexeren Schritten biete ich detaillierte Erklärungen oder Video-Links an."

- question: "Darf ich handgefertigte Artikel verkaufen?"
  answer: "Ja, der Verkauf von fertigen Stücken in kleinen Mengen ist erlaubt. Die Massenproduktion sowie der Weiterverkauf oder das Teilen der digitalen Dateien selbst ist untersagt. Bitte gib ShonieStyle als Quelle an."
