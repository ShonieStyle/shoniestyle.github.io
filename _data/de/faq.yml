- question: "Für welche Größen und Modelle sind die Schnittmuster?"
  answer: "<b>Puppen-Schnittmuster:</b> Ich biete Schnitte für Puppen im Maßstab 1/6 und 1/12 (z. B. Barbie, Bratz, Obitsu) an. Bitte prüfe die jeweilige Artikelbeschreibung auf Körpertyp und Kompatibilität.<br><br><b>Schnittmuster für Menschen:</b> Ich biete Schnitte für Personen in verschiedenen Größen an. Detaillierte Maßtabelle findest du direkt in der jeweiligen Produktbeschreibung.<br><br><b>Accessoires:</b> Ich entwerfe auch Schnitte für verschiedenes Zubehör. Details dazu findest du in den einzelnen Artikeln."
  
- question: "Sind die Nahtzugaben im Schnittmuster enthalten?"
  answer: "<b>Puppen-Schnittmuster:</b> Ja, die Nahtzugaben sind enthalten und als <b>separate Linie</b> (Naht- und Schnittlinie) eingezeichnet.<br><br><b>Schnittmuster für Menschen:</b> Nein, die Nahtzugabe ist NICHT enthalten.<br><br><b>Accessoires:</b> Bitte prüfe hierzu die jeweilige Anleitung."

- question: "Welche Formate werden bereitgestellt und wie drucke ich sie?"
  answer: "Alle Schnitte sind digitale PDFs. Ich stelle für alle Projekte Dateien in <b>A4 und US Letter</b> zur Verfügung. Für Schnitte in Menschengröße ist zusätzlich eine <b>Großformat-Datei (A0/Plotter)</b> enthalten.<br><br><b>Wichtig:</b> Drucke immer mit 100% Skalierung. Jedes Schnittmuster enthält ein Kontrollquadrat."

- question: "Sind die Schnittmuster für Anfänger geeignet?"
  answer: "Ja! Die meisten meiner Schnitte sind anfängerfreundlich und enthalten eine Schritt-für-Schritt-Fotoanleitung. Bei komplexeren Schritten biete ich detaillierte Erklärungen oder Video-Links an."

- question: "Darf ich handgefertigte Artikel verkaufen?"
  answer: "Ja, der Verkauf von fertigen Stücken in kleinen Mengen ist erlaubt. Die Massenproduktion sowie der Weiterverkauf oder das Teilen der digitalen Dateien selbst ist untersagt. Bitte gib ShonieStyle als Quelle an."
