- question: "Wie erhalte ich mein Schnittmuster nach dem Kauf?"
  answer: "Nach dem Kauf auf Etsy erhältst du einen digitalen Download. Du kannst die Dateien sofort speichern und zu Hause ausdrucken oder auf einem Tablet verwenden."

- question: "Sind die Anleitungen auch für Anfänger geeignet?"
  answer: "Ja. Die Modelle sind so aufgebaut, dass sie klar nachvollziehbar sind. Der Schwierigkeitsgrad kann je nach Schnitt variieren, wird aber jeweils transparent angegeben."

- question: "Gibt es passende Schnitte für Partner- oder Familienlooks?"
  answer: "Ja, genau darauf ist die Kollektion ausgerichtet. Viele Modelle lassen sich für Erwachsene, Kinder oder Puppen optisch miteinander kombinieren."

- question: "Kann ich die Schnitte gewerblich nutzen?"
  answer: "Bitte prüfe die jeweilige Produktbeschreibung auf Etsy. Wenn du eine erweiterte Nutzung planst, empfiehlt sich eine individuelle Rückfrage."

- question: "Bietest du Rückgabe oder Umtausch an?"
  answer: "Da es sich um digitale Produkte handelt, gelten besondere Regeln. Details dazu findest du auf der Seite Widerrufsbelehrung."
