- question: "Which sizes and models are your patterns for?"
  answer: "<b>Doll patterns:</b> I offer patterns for 1/6 and 1/12 scale dolls (e.g., Barbie, Bratz, Obitsu). Please refer to the specific listing for details regarding body types and compatibility.<br><br><b>Human-sized patterns:</b> I provide patterns for people in various sizes. Detailed size charts and measurements are available within each product description.<br><br><b>Accessories:</b> I also design patterns for various accessories. Please consult the individual listings for further information."

- question: "Do the patterns include seam allowances?"
  answer: "<b>Doll patterns:</b> Yes, seam allowances are included and marked with a <b>separate line</b> (stitching & cutting lines). This allows for high precision during the sewing process.<br><br><b>Human-sized patterns:</b> No, seam allowances are NOT included unless stated otherwise.<br><br><b>Accessories:</b> Please refer to the instructions provided with each individual pattern."

- question: "What formats are provided and how should they be printed?"
  answer: "All patterns are digital PDFs. I provide <b>A4 and US Letter</b> formats for all projects. For human-sized patterns, a <b>wide-format A0 (Plotter)</b> file is also included.<br><br><b>Important:</b> Please ensure your printer is set to 100% scale (Actual Size). Every pattern features a control square in cm and inches to verify printing accuracy."

- question: "Is this pattern suitable for beginners?"
  answer: "Yes. The majority of my patterns are beginner-friendly and include a comprehensive step-by-step photo tutorial. For more complex projects, I provide detailed explanations or video links to assist you through the process."

- question: "Can I sell items made with your patterns?"
  answer: "Yes, you are welcome to sell finished items made from my patterns in small quantities. However, mass production or the reselling/distribution of the digital files is strictly prohibited. Please credit ShonieStyle as the pattern designer when presenting your work."

- question: "Are your patterns official products of doll brands?"
  answer: "No. <b>ShonieStyle</b> is an independent design studio. My patterns are not affiliated with, endorsed by, or associated with any doll brand (e.g., Barbie, Bratz). Brand names are used solely to describe the fit and compatibility of the designs."
