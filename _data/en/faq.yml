- question: "Which sizes and models are your patterns for?"
  answer: "<b>Doll patterns:</b> I offer patterns for 1/6 and 1/12 scale dolls (e.g., Barbie, Bratz, Obitsu). Please check the specific listing for body types and compatibility.<br><br><b>Human-sized patterns:</b> I provide patterns for people in various sizes. Detailed size charts and measurements are available in each product description.<br><br><b>Accessories:</b> I also design patterns for various accessories. Please refer to the individual listings for details."

- question: "Do the patterns include seam allowances?"
  answer: "<b>Doll patterns:</b> Yes, seam allowances are included and marked with a <b>separate line</b> (stitching & cutting lines).<br><br><b>Human-sized patterns:</b> No, seam allowances are NOT included unless stated otherwise.<br><br><b>Accessories:</b> Please check the individual pattern instructions."

- question: "What formats are provided and how do I print them?"
  answer: "All patterns are digital PDFs. I provide <b>A4 and US Letter</b> formats for all projects. For human-sized patterns, I also include a <b>wide-format A0 (Plotter)</b> file.<br><br><b>Important:</b> Always print at 100% scale (Actual Size). Every pattern features a control square in cm and inches."

- question: "Is this pattern suitable for beginners?"
  answer: "Yes! Most of my patterns are beginner-friendly and include a step-by-step photo tutorial. If a project is more complex, I explain the tricky steps in detail or provide a video link."

- question: "Can I sell items made with your patterns?"
  answer: "Yes, you can sell finished items made from my patterns in small quantities. However, mass production or reselling the digital files is strictly prohibited. Please credit ShonieStyle when possible!"
