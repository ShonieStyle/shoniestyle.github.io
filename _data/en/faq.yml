- question: "Which sizes and models are your patterns for?"
  answer: "I offer a variety of patterns: 1/6 and 1/12 scale doll clothes (e.g., Barbie, Bratz), accessories, and patterns for people. For dolls, please check the specific listing for body types; for human-sized patterns, check the description for available sizes and measurements."

- question: "Do the patterns include seam allowances?"
  answer: "**Doll patterns:** Yes, seam allowances are included and marked with a **separate line** (stitching & cutting lines). **Human-sized patterns:** No, seam allowances are NOT included unless stated otherwise. **Accessories:** Please check the individual pattern instructions."

- question: "What formats are provided and how do I print them?"
  answer: "All patterns are digital PDFs. I provide **A4 and US Letter** formats for all projects. For human-sized patterns, I also include a **wide-format A0 (Plotter)** file. **Important:** Always print at 100% scale (Actual Size). Every pattern features a control square in cm and inches."

- question: "Is this pattern suitable for beginners?"
  answer: "Yes! Most of my patterns are beginner-friendly and include a step-by-step photo tutorial. If a project is more complex, I explain the tricky steps in detail or provide a video link."

- question: "Can I sell items made with your patterns?"
  answer: "Yes, you can sell finished items made from my patterns in small quantities. However, mass production or reselling the digital files is strictly prohibited. Please credit ShonieStyle when possible!"
