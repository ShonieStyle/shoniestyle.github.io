---
layout: default
---

<section class="page-hero">
    <div class="container">
        <p class="eyebrow">{{ page.eyebrow | default: 'Information' }}</p>
        <h1>{{ page.title }}</h1>
        {% if page.lead %}
        <p class="page-lead">{{ page.lead }}</p>
        {% endif %}
    </div>
</section>

<section class="page-content">
    <div class="container rte">
        {{ content }}
    </div>
</section>
