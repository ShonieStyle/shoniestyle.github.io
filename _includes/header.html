<header class="site-header">
    <div class="container site-header__inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ include.content.brand.name }}">
            <span class="brand__mark">{{ include.content.brand.logo_text }}</span>
            <span class="brand__name">{{ include.content.brand.name }}</span>
        </a>

        <nav class="site-nav" aria-label="Hauptnavigation">
            {% for item in include.content.navigation %}
            <a href="{{ item.url | relative_url }}">{{ item.label }}</a>
            {% endfor %}
        </nav>
    </div>
</header>
