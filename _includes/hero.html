{% assign hero = site.data[page.lang].site.hero %}
<section class="hero">
    <div class="container hero__grid">
        <div class="hero__content">
            <p class="eyebrow">{{ hero.eyebrow }}</p>
            <h1>{{ hero.title }}</h1>
            <p class="hero__description">{{ hero.description }}</p>

            <div class="hero__actions">
                <a class="button button--primary" href="{{ hero.primary_url }}" target="_blank" rel="noreferrer">{{
                    hero.primary_label }}</a>
                <a class="button button--secondary" href="{{ hero.secondary_url | relative_url }}">{{
                    hero.secondary_label }}</a>
            </div>
        </div>

        <div class="hero__media">
            <img src="{{ hero.image | relative_url }}" alt="{{ hero.image_alt }}">
        </div>
    </div>
</section>
